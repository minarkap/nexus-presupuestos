<!-- @dsCard group="Colors" viewport="700x180" name="Brand Core" subtitle="The six signature Nexus colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-body); background: var(--surface-base); padding: 22px 24px; }
  .row { display:flex; gap:14px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius: var(--radius-md); box-shadow: var(--inset-hairline); }
  .name { font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--text-strong); margin-top:10px; }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin-top:3px; letter-spacing:0.03em; }
  .es  { font-size:10.5px; color:var(--text-faint); margin-top:2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#07111F"></div><div class="name">Night</div><div class="hex">#07111F</div><div class="es">Azul noche</div></div>
    <div class="sw"><div class="chip" style="background:#145CFF"></div><div class="name">Nexus Blue</div><div class="hex">#145CFF</div><div class="es">Azul Nexus</div></div>
    <div class="sw"><div class="chip" style="background:#21D4FD"></div><div class="name">Electric Cyan</div><div class="hex">#21D4FD</div><div class="es">Cian eléctrico</div></div>
    <div class="sw"><div class="chip" style="background:#F5F8FF"></div><div class="name">Cold White</div><div class="hex">#F5F8FF</div><div class="es">Blanco frío</div></div>
    <div class="sw"><div class="chip" style="background:#1E293B"></div><div class="name">Graphite</div><div class="hex">#1E293B</div><div class="es">Gris grafito</div></div>
    <div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="name">Technical</div><div class="hex">#94A3B8</div><div class="es">Gris técnico</div></div>
  </div>
</body>
</html>
