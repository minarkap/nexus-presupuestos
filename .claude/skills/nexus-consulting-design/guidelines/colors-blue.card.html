<!-- @dsCard group="Colors" viewport="700x130" name="Blue Ramp" subtitle="Nexus Blue — primary action scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-base); padding:22px 24px; }
  .ramp { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--inset-hairline); }
  .step { flex:1; height:72px; display:flex; align-items:flex-end; padding:8px; }
  .lab { font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.85); }
  .dark { color:rgba(7,17,31,0.7); }
</style>
</head>
<body>
  <div class="ramp">
    <div class="step" style="background:#0B3FCC"><span class="lab">700</span></div>
    <div class="step" style="background:#0F4CE6"><span class="lab">600</span></div>
    <div class="step" style="background:#145CFF"><span class="lab">500</span></div>
    <div class="step" style="background:#4A82FF"><span class="lab">400</span></div>
    <div class="step" style="background:#84A9FF"><span class="lab dark">300</span></div>
  </div>
</body>
</html>
