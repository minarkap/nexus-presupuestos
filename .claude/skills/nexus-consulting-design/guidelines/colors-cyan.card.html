<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-base); padding:22px 24px; }
  .ramp { display:flex; border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--inset-hairline); }
  .step { flex:1; height:72px; display:flex; align-items:flex-end; padding:8px; }
  .lab { font-family:var(--font-mono); font-size:10px; color:rgba(7,17,31,0.72); }
</style>
</head>
<body>
  <div class="ramp">
    <div class="step" style="background:#0FB3DB"><span class="lab" style="color:rgba(255,255,255,0.85)">600</span></div>
    <div class="step" style="background:#21D4FD"><span class="lab">500</span></div>
    <div class="step" style="background:#5FE2FE"><span class="lab">400</span></div>
    <div class="step" style="background:#9CEEFF"><span class="lab">300</span></div>
  </div>
</body>
</html>
