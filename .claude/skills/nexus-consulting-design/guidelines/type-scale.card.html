<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Sora display scale, xl → 2xs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-display); background:var(--surface-base); padding:22px 28px; color:var(--text-strong); }
  .line { display:flex; align-items:baseline; gap:16px; padding:3px 0; }
  .line span.t { font-family:var(--font-mono); font-size:10px; color:var(--text-faint); width:64px; flex:none; }
  .s1 { font-size:48px; font-weight:700; letter-spacing:-0.02em; }
  .s2 { font-size:30px; font-weight:600; }
  .s3 { font-size:24px; font-weight:600; }
  .s4 { font-size:20px; font-weight:500; }
  .s5 { font-size:16px; font-weight:500; color:var(--text-body); font-family:var(--font-body); }
</style>
</head>
<body>
  <div class="line"><span class="t">4xl/48</span><span class="s1">Nexus</span></div>
  <div class="line"><span class="t">2xl/30</span><span class="s2">Conectamos sistemas</span></div>
  <div class="line"><span class="t">xl/24</span><span class="s3">Automatización con control</span></div>
  <div class="line"><span class="t">lg/20</span><span class="s4">Visibilidad operativa total</span></div>
  <div class="line"><span class="t">base/16</span><span class="s5">Cuerpo de texto en Inter para interfaces y lectura.</span></div>
</body>
</html>
