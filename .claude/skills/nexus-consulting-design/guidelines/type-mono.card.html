<!-- @dsCard group="Type" viewport="700x160" name="Mono — IBM Plex Mono" subtitle="Data, metrics & system labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-mono); background:var(--surface-base); padding:26px 28px; }
  .metric { font-size:40px; font-weight:600; color:var(--accent-secondary); letter-spacing:-0.01em; }
  .label { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:0.12em; text-transform:uppercase; margin-top:6px; }
  .ln { font-size:13px; color:var(--text-body); margin-top:14px; }
</style>
</head>
<body>
  <div class="metric">99.98%</div>
  <div class="label">Uptime · últimos 90 días</div>
  <div class="ln">POST /api/v2/flows → 200 OK · 142ms</div>
</body>
</html>
