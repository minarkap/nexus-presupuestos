<!-- @dsCard group="Brand" viewport="700x220" name="Isotype" subtitle="The connected-node mark — clear space = 1 node" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-base); padding:30px; display:flex; gap:36px; align-items:center; justify-content:center; }
  .a { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:22px; }
  .a img { height:120px; display:block; }
  .b { background:var(--nx-graphite); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--glow-blue-sm); }
  .b img { height:120px; display:block; }
  .cap { font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-align:center; margin-top:10px; letter-spacing:0.08em; }
</style>
</head>
<body>
  <div><div class="a"><img src="../assets/nexus-isotype.png" alt="Nexus isotype on night"></div><div class="cap">ON NIGHT</div></div>
  <div><div class="b"><img src="../assets/nexus-isotype.png" alt="Nexus isotype on graphite"></div><div class="cap">ON GRAPHITE · GLOW</div></div>
</body>
</html>
