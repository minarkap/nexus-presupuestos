<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-display); background:var(--surface-base); padding:26px 28px; }
  .eyebrow { font-size:13px; font-weight:600; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent-secondary); }
  .eyebrow2 { font-size:12px; font-weight:500; letter-spacing:0.28em; text-transform:uppercase; color:var(--text-muted); margin-top:14px; }
  .h { font-size:28px; font-weight:700; color:var(--text-strong); letter-spacing:-0.01em; margin-top:10px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:16px; }
</style>
</head>
<body>
  <div class="eyebrow">Servicios</div>
  <div class="h">Software a medida</div>
  <div class="eyebrow2">Consulting · Andorra</div>
  <div class="meta">letter-spacing: 0.28em · uppercase</div>
</body>
</html>
