<!-- @dsCard group="Components" viewport="700x320" name="Data Display" subtitle="KPI tiles & progress" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-base); padding:28px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .bars { margin-top:22px; display:flex; flex-direction:column; gap:16px; max-width:560px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { StatCard, ProgressBar } = window.NexusConsultingDesignSystem_c7745a;
    function Demo() {
      return (
        <div>
          <div className="grid">
            <StatCard label="Tareas automatizadas" value="1,284" delta="18%" trend="up" accent="cyan" />
            <StatCard label="Tiempo manual" value="42" unit="h" delta="9%" trend="down" accent="blue" />
            <StatCard label="Uptime" value="99.98" unit="%" delta="0.2%" trend="up" accent="cyan" />
          </div>
          <div className="bars">
            <ProgressBar label="Integración de sistemas" value={72} />
            <ProgressBar label="Migración de datos" value={45} tone="cyan" />
            <ProgressBar label="Cobertura de pruebas" value={88} tone="success" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
